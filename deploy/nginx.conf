# InsightCrew Nginx 反向代理
#
# 唯一对公网开放的入口。api 容器只绑 127.0.0.1:8000，外部无法绕过这里。
#
# ★ 关键：SSE 端点必须 proxy_buffering off，否则实时时间线会被缓冲成
#   "跑完一次性吐出"，SSE 等于白做（见 开发设计规划 §7.1 C2）。
#
# ★ 关键：upstream 用 resolve + 显式 resolver。nginx 默认只在启动时把
#   `api` 解析一次并缓存 IP；此后 `docker compose up -d` 重建 api 容器会
#   换 IP，nginx 仍打旧 IP → 永久 502（实测踩过）。valid=10s 让它定期重解析。

# Docker 内嵌 DNS（127.0.0.11），用于解析 compose 服务名
resolver 127.0.0.11 valid=10s ipv6=off;

upstream insightcrew_api {
    zone insightcrew_api 64k;
    server api:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传/表单体积上限（当前无文件上传，留小值即可）
    client_max_body_size 2m;

    # 隐藏版本号
    server_tokens off;

    # ---- 通用代理头 ----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # ★ 应用侧 client_ip() 只在 TRUST_PROXY=1 时读这个头（compose 里已设）
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # 默认超时（普通请求）
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---- SSE：任务事件流（唯一的实时通道）----
    # 精确匹配 /research/<数字>/events
    location ~ ^/research/[0-9]+/events$ {
        proxy_pass http://insightcrew_api;

        proxy_buffering off;              # ★ 必须
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;

        # 长任务 + 等人工闸门，连接可能挂很久
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 中间不要有缓冲层改写响应
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    # ---- 健康检查（供监控/探针直接打）----
    location = /healthz {
        proxy_pass http://insightcrew_api;
        proxy_read_timeout 30s;           # ?models=1 会真去探测模型，给足时间
        access_log off;
    }
    location = /health {
        proxy_pass http://insightcrew_api;
        access_log off;
    }

    # ---- 其余全部转发（API + 页面）----
    location / {
        proxy_pass http://insightcrew_api;
    }
}
