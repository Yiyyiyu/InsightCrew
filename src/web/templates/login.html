{% extends "base.html" %}
{% block title %}登录 · InsightCrew{% endblock %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;">
    <h2>登录 InsightCrew</h2>
    <p class="ic-muted">多 Agent 协作技术调研与选型平台</p>

    <article>
        <form id="ic-login-form" onsubmit="return false;">
            <label>用户名
                <input type="text" id="username" name="username" autocomplete="username" required>
            </label>
            <label>密码
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit" id="ic-login-btn">登录</button>
            <button type="button" class="secondary outline" onclick="icDemoLogin()">Demo 账号一键登录</button>
        </form>
        <p class="ic-muted" style="margin-top:.8rem;">
            没有账号？<a href="#" onclick="icSwitchRegister();return false;">注册一个</a>
        </p>
        <div id="ic-msg" class="ic-muted"></div>
    </article>
</div>
{% endblock %}

{% block scripts %}
<script>
    let icRegisterMode = false;

    function icSwitchRegister() {
        icRegisterMode = !icRegisterMode;
        document.getElementById('ic-login-btn').textContent = icRegisterMode ? '注册' : '登录';
        document.querySelector('#ic-login-form').closest('article')
            .querySelector('p.ic-muted').innerHTML = icRegisterMode
            ? '已有账号？<a href="#" onclick="icSwitchRegister();return false;">去登录</a>'
            : '没有账号？<a href="#" onclick="icSwitchRegister();return false;">注册一个</a>';
    }

    function icDemoLogin() {
        document.getElementById('username').value = 'demo';
        document.getElementById('password').value = 'demo1234';
        icSubmit();
    }

    async function icSubmit() {
        const msg = document.getElementById('ic-msg');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) { msg.textContent = '请填写用户名与密码'; return; }

        const url = icRegisterMode ? '/auth/register' : '/auth/login';
        msg.textContent = '处理中 ...';
        try {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) {
                msg.textContent = data.detail || ('失败：HTTP ' + r.status);
                return;
            }
            if (icRegisterMode) {
                msg.textContent = '注册成功，正在登录 ...';
                icRegisterMode = false;
                await icSubmit();
                return;
            }
            // 登录接口已下发 HttpOnly Cookie，直接跳转即可
            location.href = '/tasks';
        } catch (e) {
            msg.textContent = '网络错误：' + e;
        }
    }

    document.getElementById('ic-login-form').addEventListener('submit', icSubmit);
</script>
{% endblock %}
